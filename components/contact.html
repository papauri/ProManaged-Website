<section id="contact" class="contact">
    <div class="container">
        <div class="section-header">
            <h2>Contact Us</h2>
            <p class="subtitle">We'd love to hear from you! Feel free to reach out with any questions, feedback, or requests.</p>
        </div>

        <!-- Contact Form -->
        <form class="contact-form">
            <div class="form-group">
                <div class="input-container">
                    <input type="text" id="name" name="name" placeholder=" " required>
                    <label for="name">Full Name</label>
                </div>
            </div>
            <div class="form-group">
                <div class="input-container">
                    <input type="email" id="email" name="email" placeholder=" " required>
                    <label for="email">Email Address</label>
                </div>
            </div>
            <div class="form-group">
                <div class="input-container">
                    <input type="tel" id="phone" name="phone" placeholder=" " pattern="[0-9+()-\s]{10,15}" required>
                    <label for="phone">Phone Number</label>
                </div>
            </div>
            <div class="form-group">
                <div class="input-container">
                    <textarea id="message" name="message" rows="4" placeholder=" " required></textarea>
                    <label for="message">Your Message</label>
                </div>
            </div>
            <div class="button-container">
                <button type="submit" class="btn primary">Send Message</button>
            </div>
        </form>
    </div>
</section>
