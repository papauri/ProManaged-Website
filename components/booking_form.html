<section class="booking-section">
    <div class="container">
        <h2>Book an Appointment</h2>
        <p>Select your service, choose a time, and let us take care of the rest!</p>
        <!-- Booking Button -->
        <button id="open-booking-modal" class="btn primary">Book Now</button>
    </div>
</section>

<!-- Modal for Booking Form -->
<div id="booking-modal" class="modal">
    <div class="modal-content">
        <span id="close-booking-modal" class="close">&times;</span>
        <h2>Book an Appointment</h2>
        <form id="booking-form">
            <div class="form-row">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-row">
                <label for="service">Service</label>
                <select id="service" name="service" required>
                    <option value="Gaming Services">Gaming Services</option>
                    <option value="Network Infrastructure">Network Infrastructure</option>
                </select>
            </div>
            <div class="form-row">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-row">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>
            </div>
            <button type="submit" class="btn primary">Confirm Appointment</button>
        </form>
    </div>
</div>
